name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - name: Check release tag
        id: tag
        run: |
          if [[ $GITHUB_REF_NAME =~ alpha|beta|rc ]]; then
            echo "version_tag=${BASH_REMATCH[0]}" >> $GITHUB_OUTPUT
          else
            echo "version_tag=latest" >> $GITHUB_OUTPUT
          fi
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          package-manager-cache: false
      - name: Setup dotnet CLI
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
          dotnet-channel: LTS
        env:
          DOTNET_NOLOGO: true
          DOTNET_CLI_TELEMETRY_OPTOUT: true
      - name: Install dependencies
        run: pnpm install
      - name: Run Vite Build
        run: pnpm run build
      - name: Publish to npm
        run: pnpm publish --tag ${{ steps.tag.outputs.version_tag }} --no-git-checks --access public
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $([ "${{ steps.tag.outputs.version_tag }}" != "latest" ] && echo "--prerelease")

      - name: Pack for nuget
        run: dotnet pack .\.nuspec -o .\nupkg
      - name: NuGet login
        uses: NuGet/login@v1
        id: nugetlogin
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to nuget
        run: |
          dotnet nuget push .\nupkg\*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nugetlogin.outputs.NUGET_API_KEY }} \
            --skip-duplicate
